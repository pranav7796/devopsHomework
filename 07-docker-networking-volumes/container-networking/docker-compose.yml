services:
  frontend:
    image: nginx:1.27-alpine
    networks:
      - frontend-net

  backend:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks:
      - frontend-net
      - backend-net

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: homework
      MYSQL_DATABASE: homework
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-phomework"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database-data:/var/lib/mysql
    networks:
      - backend-net
      - database-net

networks:
  frontend-net:
  backend-net:
  database-net:

volumes:
  database-data:
