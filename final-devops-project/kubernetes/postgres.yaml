apiVersion: v1
kind: Service
metadata:
  name: homework-db
spec:
  selector: {app: homework-db}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homework-db
spec:
  serviceName: homework-db
  replicas: 1
  selector:
    matchLabels: {app: homework-db}
  template:
    metadata:
      labels: {app: homework-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - {name: POSTGRES_DB, value: homework}
            - {name: POSTGRES_USER, value: homework}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: homework-api-secret, key: DB_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U homework -d homework"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
