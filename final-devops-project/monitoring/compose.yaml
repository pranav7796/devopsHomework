name: devops-homework-monitoring
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [homework]
  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your shell}
    volumes:
      - ./datasource.yml:/etc/grafana/provisioning/datasources/homework.yml:ro
    networks: [homework]
  node-exporter:
    image: prom/node-exporter:v1.8.2
    networks: [homework]
networks:
  homework:
    external: true
    name: devops-homework-final_default
