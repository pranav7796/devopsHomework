name: devops-homework-final
services:
  api:
    build:
      context: ../..
      dockerfile: final-devops-project/docker/Dockerfile
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://homework:${DB_PASSWORD:?Set DB_PASSWORD in your shell}@db:5432/homework
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homework
      POSTGRES_USER: homework
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
    volumes: [database-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U homework -d homework]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  database-data:
