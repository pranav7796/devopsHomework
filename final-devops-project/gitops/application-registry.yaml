# Isolated Minikube verification of the CI-published GHCR image.
# Create homework-api-secret in homework-registry before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homework-api-registry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pranav7796/devopsHomework.git
    targetRevision: main
    path: final-devops-project/helm
    helm:
      releaseName: homework-registry
      parameters:
        - {name: ingress.enabled, value: "false"}
        - {name: autoscaling.enabled, value: "false"}
  destination:
    server: https://kubernetes.default.svc
    namespace: homework-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
