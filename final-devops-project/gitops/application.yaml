apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homework-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pranav7796/devopsHomework.git
    targetRevision: main
    path: final-devops-project/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: homework
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
