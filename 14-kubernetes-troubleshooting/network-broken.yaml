apiVersion: v1
kind: Pod
metadata:
  name: session14-web
  namespace: session14-debug
  labels: {app: session14-web}
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: session14-web
  namespace: session14-debug
spec:
  selector: {app: wrong-label}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: loopback-only
  namespace: session14-debug
  labels: {app: loopback-only}
spec:
  containers:
    - name: web
      image: busybox:1.36
      command: [sh, -c, "mkdir -p /www; echo session14-network-ok > /www/index.html; httpd -f -p 127.0.0.1:8080 -h /www"]
      ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: session14-debug
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: [sleep, "3600"]
