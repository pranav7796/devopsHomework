apiVersion: v1
kind: Pod
metadata:
  name: crash-loop
  namespace: session14-debug
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, "echo 'healthy startup'; sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-image
  namespace: session14-debug
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-node
  namespace: session14-debug
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-volume
  namespace: session14-debug
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "3600"]
      volumeMounts:
        - {name: missing-config, mountPath: /config}
  volumes:
    - name: missing-config
      configMap: {name: session14-absent-config}
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-key
  namespace: session14-debug
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "3600"]
      env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef: {name: session14-config, key: APP_MODE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: session14-absent-config
  namespace: session14-debug
data:
  status: repaired
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: session14-config
  namespace: session14-debug
data:
  APP_MODE: healthy
