name: CI and DevSecOps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit tests
        run: python -m unittest discover -s final-devops-project/application -p 'test_*.py' -v
      - name: SAST (Bandit)
        run: pipx run bandit -r final-devops-project/application -ll
      - name: SCA (pip-audit)
        run: pipx run pip-audit -r final-devops-project/application/requirements.txt
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -f final-devops-project/docker/Dockerfile -t homework-api:${{ github.sha }} .
      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: homework-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-security
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Choose lowercase image path
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}/homework-api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: final-devops-project/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ github.sha }}
            ${{ steps.image.outputs.repository }}:latest
      - name: Advance GitOps image tag
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('final-devops-project/helm/values.yaml')
          lines = path.read_text().splitlines()
          lines = [f'  repository: {os.environ["IMAGE_REPOSITORY"]}' if line.startswith('  repository:') else line for line in lines]
          lines = [f'  tag: {os.environ["IMAGE_TAG"]}' if line.startswith('  tag:') else line for line in lines]
          path.write_text('\n'.join(lines) + '\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final-devops-project/helm/values.yaml
          git commit -m "Deploy image $IMAGE_TAG" || exit 0
          git push origin HEAD:main
